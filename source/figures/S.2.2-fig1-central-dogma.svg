<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">From gene to protein: transcription and translation</title>
  <desc id="d">Three boxes left to right. DNA in the nucleus, with the example sequence TAC GGA, is transcribed into messenger RNA, AUG CCU, which leaves the nucleus. At a ribosome in the cytoplasm the mRNA is translated, three bases (one codon) at a time, into a chain of amino acids: methionine, then proline. The chain folds into a protein.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#FFFFFF"/>
  <style>.h{font-size:17px;font-weight:bold}.t{font-size:14px}.m{font-family:'Courier New',monospace;font-size:17px;font-weight:bold}</style>

  <!-- Nucleus region -->
  <rect x="10" y="40" width="390" height="230" rx="18" fill="#EEF2FA" stroke="#5A6FA8" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="24" y="30" class="t" fill="#5A6FA8" font-weight="bold">NUCLEUS</text>
  <text x="420" y="30" class="t" fill="#7A5C2E" font-weight="bold">CYTOPLASM</text>

  <!-- DNA -->
  <rect x="30" y="80" width="160" height="120" rx="12" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="110" y="108" text-anchor="middle" class="h">DNA</text>
  <text x="110" y="132" text-anchor="middle" class="t">template strand</text>
  <text x="110" y="168" text-anchor="middle" class="m">TAC GGA</text>

  <!-- mRNA -->
  <rect x="230" y="80" width="160" height="120" rx="12" fill="#FFFFFF" stroke="#333" stroke-width="2"/>
  <text x="310" y="108" text-anchor="middle" class="h">mRNA</text>
  <text x="310" y="132" text-anchor="middle" class="t">messenger RNA</text>
  <text x="310" y="168" text-anchor="middle" class="m">AUG CCU</text>

  <!-- Protein -->
  <rect x="560" y="80" width="200" height="120" rx="12" fill="#FFF6E6" stroke="#333" stroke-width="2"/>
  <text x="660" y="108" text-anchor="middle" class="h">PROTEIN</text>
  <text x="660" y="132" text-anchor="middle" class="t">chain of amino acids</text>
  <text x="660" y="168" text-anchor="middle" class="t" font-weight="bold">Met – Pro – …</text>

  <!-- Arrows -->
  <line x1="190" y1="140" x2="224" y2="140" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <line x1="390" y1="140" x2="554" y2="140" stroke="#333" stroke-width="3" marker-end="url(#a)"/>

  <text x="110" y="232" text-anchor="middle" class="h">1. TRANSCRIPTION</text>
  <text x="110" y="254" text-anchor="middle" class="t">DNA is copied into mRNA</text>

  <text x="560" y="232" text-anchor="middle" class="h">2. TRANSLATION at a ribosome</text>
  <text x="560" y="254" text-anchor="middle" class="t">each 3-base codon specifies one amino acid</text>
  <text x="560" y="276" text-anchor="middle" class="t">(tRNA brings the matching amino acid)</text>

  <text x="390" y="312" text-anchor="middle" class="t" fill="#444">Base pairing: in DNA, A–T and G–C. In RNA, uracil (U) replaces thymine (T), so A pairs with U.</text>
</svg>
