<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Path of blood through the heart, lungs and body</title>
  <desc id="d">Schematic in anatomical view, so the patient's right side is on the left of the image. Oxygen-poor blood (dashed blue) returns from the body through the venae cavae into the right atrium, passes the tricuspid valve into the right ventricle, then the pulmonary valve into the pulmonary trunk and arteries to the lungs. Oxygen-rich blood (solid red) returns through the pulmonary veins to the left atrium, passes the mitral valve into the left ventricle, then the aortic valve into the aorta and out to the body.</desc>
  <defs>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FA8"/></marker>
  </defs>
  <rect id="bg" x="0" y="0" width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Side labels -->
  <text x="270" y="503" font-size="14" fill="#444" text-anchor="middle" font-style="italic">Patient's RIGHT</text>
  <text x="490" y="503" font-size="14" fill="#444" text-anchor="middle" font-style="italic">Patient's LEFT</text>

  <!-- Lungs -->
  <rect x="200" y="30" width="360" height="80" rx="14" fill="#F2F2F2" stroke="#555" stroke-width="2"/>
  <text x="380" y="62" font-size="18" font-weight="bold" text-anchor="middle">LUNGS</text>
  <text x="380" y="88" font-size="14" text-anchor="middle">Blood picks up O₂ and gives off CO₂</text>

  <!-- Heart chambers -->
  <rect x="200" y="215" width="140" height="105" rx="10" fill="#E3ECF7" stroke="#1F5FA8" stroke-width="2.5"/>
  <text x="270" y="262" font-size="16" font-weight="bold" text-anchor="middle">Right</text>
  <text x="270" y="282" font-size="16" font-weight="bold" text-anchor="middle">atrium</text>

  <rect x="200" y="350" width="140" height="125" rx="10" fill="#E3ECF7" stroke="#1F5FA8" stroke-width="2.5"/>
  <text x="270" y="405" font-size="16" font-weight="bold" text-anchor="middle">Right</text>
  <text x="270" y="425" font-size="16" font-weight="bold" text-anchor="middle">ventricle</text>

  <rect x="420" y="215" width="140" height="105" rx="10" fill="#F9E3E1" stroke="#B3261E" stroke-width="2.5"/>
  <text x="490" y="262" font-size="16" font-weight="bold" text-anchor="middle">Left</text>
  <text x="490" y="282" font-size="16" font-weight="bold" text-anchor="middle">atrium</text>

  <rect x="420" y="350" width="140" height="125" rx="10" fill="#F9E3E1" stroke="#B3261E" stroke-width="5"/>
  <text x="490" y="405" font-size="16" font-weight="bold" text-anchor="middle">Left</text>
  <text x="490" y="425" font-size="16" font-weight="bold" text-anchor="middle">ventricle</text>
  <text x="490" y="455" font-size="12" text-anchor="middle" fill="#444">(thickest wall)</text>

  <!-- AV valves (atrium to ventricle) -->
  <line x1="270" y1="320" x2="270" y2="348" stroke="#1F5FA8" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#aBlue)"/>
  <text x="190" y="340" font-size="13" text-anchor="end" font-weight="bold">Tricuspid valve</text>
  <line x1="490" y1="320" x2="490" y2="348" stroke="#B3261E" stroke-width="3" marker-end="url(#aRed)"/>
  <text x="570" y="340" font-size="13" font-weight="bold">Mitral (bicuspid) valve</text>

  <!-- Venae cavae: body to right atrium -->
  <path d="M150,560 L55,560 L55,267 L196,267" fill="none" stroke="#1F5FA8" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#aBlue)"/>
  <text x="45" y="420" font-size="13" text-anchor="middle" transform="rotate(-90 45 420)" font-weight="bold">Superior and inferior venae cavae</text>

  <!-- Pulmonary trunk/arteries: RV to lungs -->
  <path d="M340,412 L375,412 L375,114" fill="none" stroke="#1F5FA8" stroke-width="3" stroke-dasharray="7,5" marker-end="url(#aBlue)"/>
  <text x="368" y="160" font-size="13" text-anchor="end" font-weight="bold">Pulmonary valve, then</text>
  <text x="368" y="176" font-size="13" text-anchor="end" font-weight="bold">pulmonary trunk and arteries</text>

  <!-- Pulmonary veins: lungs to left atrium -->
  <path d="M490,110 L490,211" fill="none" stroke="#B3261E" stroke-width="3" marker-end="url(#aRed)"/>
  <text x="500" y="160" font-size="13" font-weight="bold">Pulmonary veins</text>

  <!-- Aorta: LV to body -->
  <path d="M560,412 L650,412 L650,560 L614,560" fill="none" stroke="#B3261E" stroke-width="3" marker-end="url(#aRed)"/>
  <text x="662" y="460" font-size="13" font-weight="bold">Aortic valve,</text>
  <text x="662" y="476" font-size="13" font-weight="bold">then aorta</text>

  <!-- Body -->
  <rect x="150" y="525" width="460" height="70" rx="14" fill="#F2F2F2" stroke="#555" stroke-width="2"/>
  <text x="380" y="555" font-size="18" font-weight="bold" text-anchor="middle">BODY TISSUES</text>
  <text x="380" y="580" font-size="14" text-anchor="middle">Cells take O₂ from the blood and add CO₂</text>

  <!-- Legend -->
  <line x1="40" y1="622" x2="90" y2="622" stroke="#B3261E" stroke-width="3"/>
  <text x="98" y="627" font-size="13">Oxygen-rich blood (solid red)</text>
  <line x1="330" y1="622" x2="380" y2="622" stroke="#1F5FA8" stroke-width="3" stroke-dasharray="7,5"/>
  <text x="388" y="627" font-size="13">Oxygen-poor blood (dashed blue)</text>
</svg>
