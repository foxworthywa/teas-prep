<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Negative feedback control of blood glucose by insulin and glucagon</title>
  <desc id="d">Two loops around a central box labeled normal blood glucose. Upper loop: blood glucose rises after a meal, beta cells of the pancreas release insulin, body cells take up glucose and the liver stores it as glycogen, and blood glucose falls back to normal. Lower loop: blood glucose falls between meals or during exercise, alpha cells of the pancreas release glucagon, the liver breaks down glycogen and releases glucose, and blood glucose rises back to normal.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect id="bg" x="0" y="0" width="100%" height="100%" fill="#FFFFFF"/>
  <style>.n{font-size:15px;font-weight:bold}.t{font-size:13.5px}.ins{fill:#E6F2EC;stroke:#2E7D4F;stroke-width:2}.glu{fill:#FCEBDD;stroke:#B35C1E;stroke-width:2}</style>

  <!-- Center -->
  <rect x="20" y="190" width="170" height="90" rx="14" fill="#F2F2F2" stroke="#333" stroke-width="2.5"/>
  <text x="105" y="225" text-anchor="middle" class="n">NORMAL</text>
  <text x="105" y="245" text-anchor="middle" class="n">BLOOD GLUCOSE</text>

  <!-- Insulin loop (top) -->
  <rect x="230" y="20" width="160" height="88" rx="12" class="ins"/>
  <text x="310" y="50" text-anchor="middle" class="n">Glucose RISES</text>
  <text x="310" y="72" text-anchor="middle" class="t">after a meal</text>

  <rect x="420" y="20" width="160" height="88" rx="12" class="ins"/>
  <text x="500" y="47" text-anchor="middle" class="n">Pancreas</text>
  <text x="500" y="67" text-anchor="middle" class="t">(beta cells)</text>
  <text x="500" y="89" text-anchor="middle" class="n">releases INSULIN</text>

  <rect x="610" y="20" width="160" height="110" rx="12" class="ins"/>
  <text x="690" y="48" text-anchor="middle" class="t">Body cells take up</text>
  <text x="690" y="66" text-anchor="middle" class="t">glucose; liver</text>
  <text x="690" y="84" text-anchor="middle" class="t">stores it as</text>
  <text x="690" y="102" text-anchor="middle" class="t">glycogen</text>

  <path d="M105,186 L105,64 L224,64" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="390" y1="64" x2="414" y2="64" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="580" y1="64" x2="604" y2="64" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M690,134 L690,165 L240,165 L240,215 L196,215" fill="none" stroke="#2E7D4F" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="300" y="157" class="t" fill="#2E7D4F" font-weight="bold">Glucose falls back to normal</text>

  <!-- Glucagon loop (bottom) -->
  <rect x="230" y="362" width="160" height="88" rx="12" class="glu"/>
  <text x="310" y="392" text-anchor="middle" class="n">Glucose FALLS</text>
  <text x="310" y="414" text-anchor="middle" class="t">between meals or</text>
  <text x="310" y="432" text-anchor="middle" class="t">during exercise</text>

  <rect x="420" y="362" width="160" height="88" rx="12" class="glu"/>
  <text x="500" y="389" text-anchor="middle" class="n">Pancreas</text>
  <text x="500" y="409" text-anchor="middle" class="t">(alpha cells)</text>
  <text x="500" y="431" text-anchor="middle" class="n">releases GLUCAGON</text>

  <rect x="610" y="340" width="160" height="110" rx="12" class="glu"/>
  <text x="690" y="370" text-anchor="middle" class="t">Liver breaks down</text>
  <text x="690" y="388" text-anchor="middle" class="t">glycogen and</text>
  <text x="690" y="406" text-anchor="middle" class="t">releases glucose</text>
  <text x="690" y="424" text-anchor="middle" class="t">into the blood</text>

  <path d="M105,284 L105,406 L224,406" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="390" y1="406" x2="414" y2="406" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="580" y1="406" x2="604" y2="406" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M690,336 L690,305 L240,305 L240,255 L196,255" fill="none" stroke="#B35C1E" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="300" y="325" class="t" fill="#B35C1E" font-weight="bold">Glucose rises back to normal</text>
</svg>
